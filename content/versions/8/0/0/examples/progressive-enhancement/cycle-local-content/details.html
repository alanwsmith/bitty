[! filter markdown|safe !]
- A progressively enhanced quotation. 
- The initial quote is loaded directly 
in the HTML. 
- The progressive enhancement rotates
new quotes in on an interval. 
- The full set of quotes is loaded
via a snippet of JSON on the page
contained in a `<script>` tag
with a `type="application/json"`
attribute and the reference name
of `quotes` defined via 
the `data-template="quotes"`
attribute. 
- The quotes are accessed via
bitty's `b.data` object using
the same `quotes` key from the
reference name. 
[! endfilter !]
