[! filter markdown|safe !]
- HTML templates can be included directly on
a page by embedding them in `<script>`
tags with `type="text/html"` and
`data-template="NAME"` attributes. 
- The `<script>` tag is used instead
of `<template>` to prevent issues
with some browsers attempting to load
images from `<template>` tags
before they are used. 
[! endfilter !]
