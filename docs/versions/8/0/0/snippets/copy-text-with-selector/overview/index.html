<ul>
<li>The <code>b.copy(selector)</code> method copies text from the element
with the given selector.</li>
<li>The <code>.value</code> is copied if it exists. Otherwise, the <code>.innerHTML</code>
is copied.</li>
<li>If you want feedback (e.g. changing &quot;Copy Text&quot; to &quot;Copied&quot; for a short
interval), you can <a href="/versions/8/0/0/snippets/copy-text-with-selector-plus-message/">roll your own</a>
or use the
<a href="/versions/8/0/0/snippets/copy-with-quick-copy/">b.quickCopy</a> method.</li>
</ul>
